name: pages-poe1

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  POB_TAG: v2.68.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: jdx/mise-action@v3
      - name: Install
        run: mise run install
      - name: Build driver (wasm)
        run: mise run driver:build
      - name: Pack PoE1 PoB
        run: mise run pack --game poe1 --tag "$POB_TAG"
      - name: Split lazy-loaded data out of root.zip
        run: python3 .github/scripts/split_lazy.py "packages/packer/r2/games/poe1/versions/$POB_TAG"
      - name: Cache passive tree draw calls (web Lua is slower than LuaJIT)
        run: python3 .github/scripts/patch_tree_cache.py "packages/packer/r2/games/poe1/versions/$POB_TAG/root.zip"
      - name: Build site
        working-directory: packages/driver
        env:
          BASE_PATH: /pob-web/
          ASSET_PREFIX: /pob-web/r2
          RUN_GAME: poe1
          RUN_VERSION: ${{ env.POB_TAG }}
          RUN_BUILD: release
        run: |
          curl -fsSL https://unpkg.com/coi-serviceworker@0.1.7/coi-serviceworker.min.js -o public/coi-serviceworker.min.js
          deno task vite:build
      - name: Assemble
        run: |
          OUT=packages/driver/site
          mkdir -p $OUT/r2/games/poe1/versions
          cp -r packages/packer/r2/games/poe1/versions/$POB_TAG $OUT/r2/games/poe1/versions/
          rm -f $OUT/r2/games/poe1/versions/$POB_TAG/.pack-input.sha256
          find $OUT -name '*.map' -delete
          touch $OUT/.nojekyll
          du -sh $OUT; ls -la $OUT $OUT/assets | head -60; find $OUT -size +50M -exec ls -la {} \;
      - name: Build Cloudflare site
        working-directory: packages/driver
        env:
          BASE_PATH: /
          ASSET_PREFIX: /r2
          RUN_GAME: poe1
          RUN_VERSION: ${{ env.POB_TAG }}
          RUN_BUILD: release
        run: |
          rm -rf site-gh && mv site site-gh
          deno task vite:build
          mv site site-cf && mv site-gh site
      - name: Assemble Cloudflare site
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: |
          OUT=packages/driver/site-cf
          V=$OUT/r2/games/poe1/versions/$POB_TAG
          mkdir -p $OUT/r2/games/poe1/versions
          cp -r packages/packer/r2/games/poe1/versions/$POB_TAG $OUT/r2/games/poe1/versions/
          rm -f $V/.pack-input.sha256
          find $OUT -name '*.map' -delete
          (cd $V && H=$(sha256sum root.zip | cut -c1-10) && split -b 20M -d -a 3 root.zip "root.$H." && rm root.zip && python3 -c "import glob,json;print(json.dumps({'parts':sorted(glob.glob('root.*.[0-9][0-9][0-9]'))}))" > root.parts.json && cat root.parts.json)
          sed -i "s/__GOOGLE_CLIENT_ID__/$GOOGLE_CLIENT_ID/" $OUT/login.html
          ZH=$RUNNER_TEMP/zh-rTW; mkdir -p $ZH
          for f in Flask_tag GUI Gems_data.txt Gems_tag Items_Accessories.txt Items_Armour.txt Items_Gems.txt Items_Jewels.txt Items_Oils Items_Weapons.txt Monsters Uniques.txt Z passiveTree statDescriptions stats_words_prefix stats_words_suffix tree_dn tree_sd; do
            curl -fsSL -o "$ZH/$f.csv" "https://raw.githubusercontent.com/Chuanhsing/PoeCharm/HEAD/Data/Translate/zh-rTW/$f.csv"
          done
          python3 .github/scripts/build_zh.py $ZH $OUT/i18n/zh-TW.json
          echo "files: $(find $OUT -type f | wc -l)"; du -sh $OUT
          echo "over 25MiB:"; find $OUT -type f -size +25M -exec ls -la {} \;
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "No Cloudflare token; skipping"; exit 0; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then unset CLOUDFLARE_ACCOUNT_ID; fi
          W="npx -y wrangler@4.20.0"
          $W pages project create pob-web --production-branch main || true
          cd packages/driver
          python3 ../../.github/scripts/cloudflare_config.py "$W" pob-web-kv > wrangler.toml
          cat wrangler.toml
          $W pages deploy site-cf --project-name pob-web --branch main --commit-dirty=true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/driver/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
